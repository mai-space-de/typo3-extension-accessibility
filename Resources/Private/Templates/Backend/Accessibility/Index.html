<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <div class="module-body">
        <h1><f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:module.title" /></h1>
        <p><f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:module.description" /></p>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <strong><f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:scope.label" /></strong>
                    </div>
                    <div class="card-body p-0" style="height: 60vh; overflow-y: auto;">
                        <div style="padding: 1rem;">
                            <f:if condition="{rootPages}">
                                <f:then>
                                    <div class="list-group">
                                        <f:for each="{rootPages}" as="page">
                                            <a href="?selectedPageUid={page.uid}"
                                               class="list-group-item list-group-item-action {f:if(condition: '{selectedPageUid} == {page.uid}', then: 'active')}">
                                                <strong>{page.title}</strong><br/>
                                                <small style="color: #666;">UID {page.uid}</small>
                                            </a>
                                        </f:for>
                                    </div>
                                </f:then>
                                <f:else>
                                    <p style="padding: 1rem; color: #999;">
                                        <f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:pages.empty" />
                                    </p>
                                </f:else>
                            </f:if>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <f:if condition="{selectedPageUid} > 0">
                    <f:then>
                        <div class="alert alert-info">
                            <f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:scope.selected_page" />
                            <strong>{selectedPageTitle}</strong> (UID {selectedPageUid})
                        </div>

                        <f:if condition="{hasPages}">
                            <f:then>
                                <div class="mb-3">
                                    <a href="{f:uri.action(action: 'check', controller: 'Accessibility', extensionName: 'MaiAccessibility', arguments: {selectedPageUid: selectedPageUid})}" class="btn btn-primary">
                                        <f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:action.run_check" />
                                    </a>
                                </div>

                                <h2><f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:pages.list.title" /></h2>
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>UID</th>
                                            <th><f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:pages.column.title" /></th>
                                            <th>Slug</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <f:for each="{pages}" as="page">
                                            <tr>
                                                <td>{page.uid}</td>
                                                <td>{page.title}</td>
                                                <td>{page.slug}</td>
                                            </tr>
                                        </f:for>
                                    </tbody>
                                </table>
                            </f:then>
                            <f:else>
                                <div class="callout callout-info mt-3">
                                    <f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:pages.empty" />
                                </div>
                            </f:else>
                        </f:if>
                    </f:then>
                    <f:else>
                        <div class="callout callout-info">
                            <f:translate key="LLL:EXT:mai_accessibility/Resources/Private/Language/locallang.xlf:scope.select_page_hint" />
                        </div>
                    </f:else>
                </f:if>
            </div>
        </div>
    </div>
</html>
