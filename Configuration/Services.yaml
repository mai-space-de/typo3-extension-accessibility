services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiAccessibility\:
    resource: '../Classes/*'

  Maispace\MaiAccessibility\Service\ImagePayloadPreparerInterface:
    alias: Maispace\MaiAccessibility\Service\ImagePayloadPreparer

  Maispace\MaiAccessibility\Service\FileMetaDataAltTextWriterInterface:
    alias: Maispace\MaiAccessibility\Service\FileMetaDataAltTextWriter

  Maispace\MaiAccessibility\Service\EmptyReferenceAltNullerInterface:
    alias: Maispace\MaiAccessibility\Service\EmptyReferenceAltNuller

  Maispace\MaiAccessibility\Service\MissingAltTextCandidateFinderInterface:
    alias: Maispace\MaiAccessibility\Service\MissingAltTextCandidateFinder

  Maispace\MaiAccessibility\Service\AltTextGenerationServiceInterface:
    alias: Maispace\MaiAccessibility\Service\AltTextGenerationService

  Maispace\MaiAccessibility\Provider\OllamaVisionClientInterface:
    alias: Maispace\MaiAccessibility\Provider\OllamaVisionClient

  Maispace\MaiAccessibility\Provider\OllamaChatClientInterface:
    alias: Maispace\MaiAccessibility\Provider\OllamaChatClient

  Maispace\MaiAccessibility\Controller\Backend\AccessibilityController:
    public: true

  Maispace\MaiAccessibility\Check\AltTextCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\HeadingStructureCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\AriaAttributeCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\LinkTextCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\BrokenLinkCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\ContrastCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\FocusTrapCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Check\LandmarksCheck:
    tags:
      - name: 'mai_accessibility.check'

  Maispace\MaiAccessibility\Service\AccessibilityCheckService:
    calls:
      - [addCheck, ['@Maispace\MaiAccessibility\Check\AltTextCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\HeadingStructureCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\AriaAttributeCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\LinkTextCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\BrokenLinkCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\ContrastCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\FocusTrapCheck']]
      - [addCheck, ['@Maispace\MaiAccessibility\Check\LandmarksCheck']]
